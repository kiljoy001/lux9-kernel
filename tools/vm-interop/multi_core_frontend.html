<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Core Semantic Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .cores-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .core-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .core-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .core-card.active {
            background: #667eea;
            color: white;
        }

        .core-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .core-docs {
            color: #666;
            font-size: 0.9rem;
        }

        .core-card.active .core-docs {
            color: rgba(255,255,255,0.8);
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .search-mode {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 2px solid #eee;
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            outline: none;
        }

        .search-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }

        .selected-cores {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .selected-cores.show {
            display: flex;
        }

        .selected-core-chip {
            background: #e2e8f0;
            color: #4a5568;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .remove-core {
            background: #e53e3e;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        .results-section {
            display: grid;
            gap: 20px;
        }

        .core-results {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .core-results-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f7fafc;
        }

        .core-results-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
        }

        .results-count {
            background: #e2e8f0;
            color: #4a5568;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .result-item {
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .result-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.1);
        }

        .result-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .result-snippet {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
        }

        .result-snippet mark {
            background: #ffd700;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .result-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #718096;
        }

        .similarity-score {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.2rem;
            margin: 40px 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        .stats-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            color: white;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Multi-Core Semantic Search</h1>
            <p>Search across all indexed knowledge bases simultaneously</p>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-value" id="totalDocs">0</div>
                <div class="stat-label">Total Documents</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalCores">0</div>
                <div class="stat-label">Available Cores</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalSize">0</div>
                <div class="stat-label">Index Size (MB)</div>
            </div>
        </div>

        <div class="cores-overview" id="coresOverview">
            <!-- Cores will be loaded here -->
        </div>

        <div class="search-section">
            <div class="search-mode">
                <div class="mode-btn active" data-mode="all">Search All Cores</div>
                <div class="mode-btn" data-mode="single">Search Single Core</div>
                <div class="mode-btn" data-mode="multi">Search Selected Cores</div>
            </div>

            <div class="selected-cores" id="selectedCores">
                <!-- Selected cores for multi-search mode -->
            </div>

            <div class="search-box">
                <input type="text" class="search-input" id="searchInput"
                       placeholder="Search across knowledge bases..."
                       autocomplete="off">
                <button class="search-btn" onclick="performSearch()">Search</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <span class="loading-spinner"></span>
            Searching across cores...
        </div>

        <div class="results-section" id="resultsSection">
            <!-- Results will appear here -->
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let availableCores = [];
        let searchMode = 'all';
        let selectedCore = null;
        let selectedCores = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            loadCores();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    searchMode = e.target.dataset.mode;
                    updateUI();
                });
            });

            // Enter key search
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        }

        async function loadCores() {
            try {
                const [coresResponse, statsResponse] = await Promise.all([
                    fetch(`${API_BASE}/cores`),
                    fetch(`${API_BASE}/stats`)
                ]);

                const coresData = await coresResponse.json();
                const statsData = await statsResponse.json();

                availableCores = coresData.cores;

                // Update stats
                document.getElementById('totalDocs').textContent = statsData.total_documents.toLocaleString();
                document.getElementById('totalCores').textContent = statsData.core_count;
                document.getElementById('totalSize').textContent = statsData.total_size_mb.toLocaleString();

                // Render cores
                renderCores();
            } catch (error) {
                console.error('Failed to load cores:', error);
            }
        }

        function renderCores() {
            const container = document.getElementById('coresOverview');
            container.innerHTML = availableCores.map(core => `
                <div class="core-card" data-core="${core.name}" onclick="toggleCore('${core.name}')">
                    <div class="core-name">${core.name}</div>
                    <div class="core-docs">${core.documents.toLocaleString()} documents</div>
                </div>
            `).join('');
        }

        function toggleCore(coreName) {
            if (searchMode === 'single') {
                // Single core selection
                document.querySelectorAll('.core-card').forEach(card => {
                    card.classList.remove('active');
                });
                document.querySelector(`[data-core="${coreName}"]`).classList.add('active');
                selectedCore = coreName;
            } else if (searchMode === 'multi') {
                // Multi-core selection
                const card = document.querySelector(`[data-core="${coreName}"]`);
                if (selectedCores.has(coreName)) {
                    selectedCores.delete(coreName);
                    card.classList.remove('active');
                } else {
                    selectedCores.add(coreName);
                    card.classList.add('active');
                }
                updateSelectedCoresDisplay();
            }
        }

        function updateSelectedCoresDisplay() {
            const container = document.getElementById('selectedCores');
            if (searchMode === 'multi') {
                container.classList.add('show');
                container.innerHTML = Array.from(selectedCores).map(core => `
                    <div class="selected-core-chip">
                        ${core}
                        <span class="remove-core" onclick="removeCore('${core}')">×</span>
                    </div>
                `).join('');
            } else {
                container.classList.remove('show');
            }
        }

        function removeCore(coreName) {
            selectedCores.delete(coreName);
            document.querySelector(`[data-core="${coreName}"]`).classList.remove('active');
            updateSelectedCoresDisplay();
        }

        function updateUI() {
            // Reset selections
            document.querySelectorAll('.core-card').forEach(card => {
                card.classList.remove('active');
            });
            selectedCore = null;
            selectedCores.clear();
            updateSelectedCoresDisplay();
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const loading = document.getElementById('loading');
            const results = document.getElementById('resultsSection');

            loading.style.display = 'block';
            results.innerHTML = '';

            try {
                let payload = { query: query, limit: 30 };

                if (searchMode === 'single' && selectedCore) {
                    payload.core = selectedCore;
                } else if (searchMode === 'multi' && selectedCores.size > 0) {
                    payload.cores = Array.from(selectedCores);
                }

                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.core) {
                    // Single core results
                    displaySingleCoreResults(data);
                } else {
                    // Multi-core results
                    displayMultiCoreResults(data);
                }
            } catch (error) {
                console.error('Search failed:', error);
                results.innerHTML = '<div style="color: #e53e3e; text-align: center; padding: 40px;">Search failed. Please try again.</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        function displaySingleCoreResults(data) {
            const container = document.getElementById('resultsSection');

            if (!data.results || data.results.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #718096; padding: 40px;">No results found.</div>';
                return;
            }

            container.innerHTML = `
                <div class="core-results">
                    <div class="core-results-header">
                        <div class="core-results-title">${data.core}</div>
                        <div class="results-count">${data.count} results</div>
                    </div>
                    ${data.results.map(result => renderResultItem(result)).join('')}
                </div>
            `;
        }

        function displayMultiCoreResults(data) {
            const container = document.getElementById('resultsSection');

            if (!data.results_by_core || Object.keys(data.results_by_core).length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #718096; padding: 40px;">No results found.</div>';
                return;
            }

            container.innerHTML = Object.entries(data.results_by_core)
                .sort(([,a], [,b]) => b.length - a.length) // Sort by result count
                .map(([coreName, results]) => `
                    <div class="core-results">
                        <div class="core-results-header">
                            <div class="core-results-title">${coreName}</div>
                            <div class="results-count">${results.length} results</div>
                        </div>
                        ${results.map(result => renderResultItem(result)).join('')}
                    </div>
                `).join('');
        }

        function renderResultItem(result) {
            return `
                <div class="result-item" onclick="viewResult('${result.id}')">
                    <div class="result-title">${result.title || result.id}</div>
                    <div class="result-snippet">${highlightSnippet(result.snippet)}</div>
                    <div class="result-meta">
                        <span>Relevance: ${result.relevance.toFixed(2)}</span>
                        <span class="similarity-score">${(result.similarity_score * 100).toFixed(1)}%</span>
                    </div>
                </div>
            `;
        }

        function highlightSnippet(snippet) {
            const query = document.getElementById('searchInput').value;
            const words = query.split(' ');
            let highlighted = snippet;

            words.forEach(word => {
                if (word.length > 2) {
                    const regex = new RegExp(`(${word})`, 'gi');
                    highlighted = highlighted.replace(regex, '<mark>$1</mark>');
                }
            });

            return highlighted;
        }

        function viewResult(resultId) {
            console.log('View result:', resultId);
            // Implement result viewing logic
        }
    </script>
</body>
</html>
