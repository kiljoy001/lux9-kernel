<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Queue colors -->
    <linearGradient id="high" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="medium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="low" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="idle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#374151"/>
    </marker>
    <marker id="processArrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto">
      <path d="M0,0 L0,10 L12,5 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Priority Queue Structure
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Multi-Level Priority Scheduling
  </text>

  <!-- High Priority Queue (0-3) -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#high)" stroke="#047857" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">High Priority</text>
    <text x="100" y="45" text-anchor="middle" font-family="monospace" font-size="12" fill="white">Levels 0-3</text>
    <text x="100" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="white">CPU-intensive</text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Background tasks</text>
    <text x="100" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Real-time processes</text>
    <text x="100" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Low affinity</text>
  </g>

  <!-- Medium Priority Queue (4-8) -->
  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#medium)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Medium Priority</text>
    <text x="100" y="45" text-anchor="middle" font-family="monospace" font-size="12" fill="white">Levels 4-8</text>
    <text x="100" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Normal processes</text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Most user tasks</text>
    <text x="100" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Batch operations</text>
    <text x="100" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Default priority</text>
  </g>

  <!-- Low Priority Queue (9-12) -->
  <g transform="translate(550, 150)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#low)" stroke="#d97706" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Low Priority</text>
    <text x="100" y="45" text-anchor="middle" font-family="monospace" font-size="12" fill="white">Levels 9-12</text>
    <text x="100" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Interactive tasks</text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="white">UI responsiveness</text>
    <text x="100" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="white">I/O bound</text>
    <text x="100" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="white">High affinity</text>
  </g>

  <!-- EDF Queue -->
  <g transform="translate(800, 150)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#idle)" stroke="#374151" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Real-Time EDF</text>
    <text x="100" y="45" text-anchor="middle" font-family="monospace" font-size="12" fill="white">Level 13</text>
    <text x="100" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Earliest Deadline</text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="white">First scheduling</text>
    <text x="100" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Critical tasks</text>
    <text x="100" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Hard deadlines</text>
  </g>

  <!-- Queue Structure Details -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="400" height="120" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#334155">Queue Structure</text>
    
    <rect x="10" y="45" width="380" height="65" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="20" y="65" font-family="monospace" font-size="11" fill="#475569">Schedq runq[Nrq];</text>
    <text x="20" y="82" font-family="monospace" font-size="11" fill="#475569">ulong runvec;      // Bitmap of non-empty queues</text>
    <text x="20" y="99" font-family="Arial" font-size="10" fill="#64748b">• FIFO within each priority level</text>
  </g>

  <!-- Priority Calculation -->
  <g transform="translate(550, 320)">
    <rect x="0" y="0" width="400" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#15803d">Priority Calculation</text>
    
    <rect x="10" y="45" width="380" height="65" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="20" y="65" font-family="monospace" font-size="11" fill="#166534">reprioritize(p) = 13 - (p->cpu * 13 / 1000)</text>
    <text x="20" y="82" font-family="Arial" font-size="10" fill="#15803d">• Lower CPU usage → Higher priority</text>
    <text x="20" y="99" font-family="Arial" font-size="10" fill="#15803d">• Priority decays over time</text>
  </g>

  <!-- Scheduler Selection Flow -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="900" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#d97706">Scheduler Selection Logic</text>
    
    <text x="20" y="50" font-family="Arial" font-size="12" fill="#92400e">1. Search queues from highest priority (13) to lowest (0)</text>
    <text x="20" y="70" font-family="Arial" font-size="12" fill="#92400e">2. Check CPU affinity: Prefer matching CPU, steal if necessary</text>
    <text x="20" y="90" font-family="Arial" font-size="12" fill="#92400e">3. Cooperative scheduling: Check readied process first</text>
  </g>

</svg>
