<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Page table levels -->
    <linearGradient id="pml4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="pdp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="pd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="pt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    
    <!-- Address spaces -->
    <linearGradient id="virtual" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#bfdbfe"/>
    </linearGradient>
    <linearGradient id="physical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca"/>
      <stop offset="100%" style="stop-color:#fca5a5"/>
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    
    <!-- Process arrows -->
    <marker id="processArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Page Table Setup and CR3 Switch
  </text>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Transition from Bootloader to Kernel Page Tables
  </text>

  <!-- BEFORE CR3 Switch -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="500" height="600" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#92400e">BEFORE CR3 SWITCH</text>
    <text x="250" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#92400e">Limine Bootloader Page Tables</text>
    
    <!-- Virtual Address Space -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="200" height="400" rx="4" fill="url(#virtual)" stroke="#3b82f6" stroke-width="2"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af">Virtual Address</text>
      
      <!-- User space -->
      <rect x="10" y="40" width="180" height="80" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="100" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#0c4a6e">User Space</text>
      <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="#0c4a6e">0x00000000</text>
      <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#0c4a6e">0x00007FFF</text>
      
      <!-- Kernel space -->
      <rect x="10" y="140" width="180" height="80" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="100" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">Kernel Space</text>
      <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">0xFFFF8000</text>
      <text x="100" y="210" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">0xFFFFFFFF</text>
      
      <!-- HHDM -->
      <rect x="10" y="240" width="180" height="80" rx="2" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1"/>
      <text x="100" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c2d12">HHDM Mirror</text>
      <text x="100" y="275" text-anchor="middle" font-family="Arial" font-size="8" fill="#7c2d12">0xFFFF800000000000</text>
      <text x="100" y="310" text-anchor="middle" font-family="Arial" font-size="8" fill="#7c2d12">End</text>
    </g>
    
    <!-- Bootloader PML4 -->
    <g transform="translate(250, 80)">
      <rect x="0" y="0" width="220" height="400" rx="4" fill="url(#pml4)" stroke="#d97706" stroke-width="2"/>
      <text x="110" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#92400e">Bootloader PML4</text>
      
      <!-- PML4 entries -->
      <rect x="10" y="40" width="200" height="60" rx="2" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
      <text x="110" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">PML4[256]</text>
      <text x="110" y="75" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">→ Kernel Mapping</text>
      <text x="110" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">Temporary setup</text>
      
      <rect x="10" y="320" width="200" height="60" rx="2" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
      <text x="110" y="340" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">PML4[511]</text>
      <text x="110" y="355" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">→ HHDM Mapping</text>
      <text x="110" y="370" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">Direct map</text>
    </g>
    
    <!-- CR3 register -->
    <g transform="translate(100, 520)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#374151" stroke="#111827" stroke-width="2"/>
      <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">CR3</text>
      <text x="40" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="#374151">Boot PT</text>
    </g>
    
    <text x="250" y="580" text-anchor="middle" font-family="Arial" font-size="11" fill="#92400e">Temporary mapping by Limine bootloader</text>
  </g>

  <!-- CR3 SWITCH PROCESS -->
  <g transform="translate(580, 350)">
    <rect x="0" y="0" width="40" height="100" rx="8" fill="#1f2937"/>
    <text x="20" y="30" text-anchor="middle" font-family="Arial" font-size="10" fill="white" transform="rotate(-90 20 30)">CR3 SWITCH</text>
    <text x="20" y="50" text-anchor="middle" font-family="Arial" font-size="9" fill="white" transform="rotate(-90 20 50)">setuppagetables()</text>
    <text x="20" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="white" transform="rotate(-90 20 70)">Page table reload</text>
    
    <!-- Arrow showing switch -->
    <path d="M 20 0 L 20 -50" stroke="#ef4444" stroke-width="3" marker-end="url(#processArrow)"/>
  </g>

  <!-- AFTER CR3 Switch -->
  <g transform="translate(650, 100)">
    <rect x="0" y="0" width="500" height="600" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#15803d">AFTER CR3 SWITCH</text>
    <text x="250" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#15803d">Kernel Page Tables</text>
    
    <!-- Virtual Address Space (same layout) -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="200" height="400" rx="4" fill="url(#virtual)" stroke="#3b82f6" stroke-width="2"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af">Virtual Address</text>
      
      <!-- User space -->
      <rect x="10" y="40" width="180" height="80" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="100" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#0c4a6e">User Space</text>
      <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="#0c4a6e">0x00000000</text>
      <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#0c4a6e">0x00007FFF</text>
      
      <!-- Kernel space -->
      <rect x="10" y="140" width="180" height="80" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="100" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#15803d">Kernel Space</text>
      <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="8" fill="#15803d">KZERO</text>
      <text x="100" y="210" text-anchor="middle" font-family="Arial" font-size="8" fill="#15803d">0xFFFFFFFF</text>
      
      <!-- HHDM -->
      <rect x="10" y="240" width="180" height="80" rx="2" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1"/>
      <text x="100" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c2d12">HHDM Mirror</text>
      <text x="100" y="275" text-anchor="middle" font-family="Arial" font-size="8" fill="#7c2d12">0xFFFF800000000000</text>
      <text x="100" y="310" text-anchor="middle" font-family="Arial" font-size="8" fill="#7c2d12">End</text>
    </g>
    
    <!-- New Kernel PML4 -->
    <g transform="translate(250, 80)">
      <rect x="0" y="0" width="220" height="400" rx="4" fill="url(#pml4)" stroke="#d97706" stroke-width="2"/>
      <text x="110" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#92400e">Kernel PML4</text>
      
      <!-- PML4 entries with details -->
      <rect x="10" y="40" width="200" height="50" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
      <text x="110" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#15803d">PML4[256]</text>
      <text x="110" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="#15803d">→ Kernel mapping (KZERO)</text>
      
      <rect x="10" y="100" width="200" height="50" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
      <text x="110" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="#15803d">PML4[257-510]</text>
      <text x="110" y="135" text-anchor="middle" font-family="Arial" font-size="8" fill="#15803d">→ HHDM (physical mirror)</text>
      
      <rect x="10" y="160" width="200" height="50" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
      <text x="110" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#15803d">PML4[511]</text>
      <text x="110" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#15803d">→ Kernel mirror</text>
      
      <!-- Kernel page table structure -->
      <rect x="10" y="250" width="200" height="120" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="110" y="270" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">4-Level Structure</text>
      <text x="110" y="290" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">PML4 → PDP → PD → PT</text>
      <text x="110" y="310" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">512 entries each</text>
      <text x="110" y="330" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">4KB pages, 2MB pages</text>
      <text x="110" y="350" text-anchor="middle" font-family="Arial" font-size="8" fill="#92400e">Controlled by kernel</text>
    </g>
    
    <!-- New CR3 register -->
    <g transform="translate(100, 520)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
      <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">CR3</text>
      <text x="40" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="#15803d">Kernel PT</text>
    </g>
    
    <text x="250" y="580" text-anchor="middle" font-family="Arial" font-size="11" fill="#15803d">Permanent kernel-controlled mapping</text>
  </g>

  <!-- HHDM Detail Box -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="1100" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="550" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#334155">HHDM: Higher Half Direct Map</text>
    <text x="20" y="45" font-family="Arial" font-size="10" fill="#475569">• Purpose: Direct virtual access to all physical memory</text>
    <text x="350" y="45" font-family="Arial" font-size="10" fill="#475569">• Location: 0xFFFF800000000000 (architectural limit)</text>
    <text x="20" y="60" font-family="Arial" font-size="10" fill="#475569">• Mapping: Physical address + HHDM offset = Virtual address</text>
    <text x="550" y="60" font-family="Arial" font-size="10" fill="#475569">• Usage: Page table access, memory zeroing, debugging</text>
  </g>

</svg>
