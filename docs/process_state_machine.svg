<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradients -->
    <linearGradient id="grad-dead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4b5563"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="grad-new" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="grad-ready" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-running" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="grad-scheding" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="grad-moribund" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Process State Machine</text>
  <text x="400" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">Unified SIP Lifecycle Architecture</text>

  <!-- Transition Arrows (Drawn manually to avoid marker artifacts) -->
  
  <!-- Helper for Arrows: We'll draw them as part of the path or use simple polygons -->
  
  <!-- DEAD -> NEW -->
  <path d="M 150 150 L 630 150" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M 630 150 L 620 144 L 620 156 Z" fill="#334155"/>
  <text x="390" y="140" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1e293b">newproc()</text>

  <!-- NEW -> READY -->
  <path d="M 600 210 L 170 340" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M 170 340 L 182 338 L 178 330 Z" fill="#334155" transform="rotate(-15, 170, 340)"/>
  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1e293b">ready()</text>

  <!-- READY -> RUNNING -->
  <path d="M 160 380 L 330 380" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M 330 380 L 320 374 L 320 386 Z" fill="#334155"/>
  <text x="245" y="370" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1e293b">runproc()</text>

  <!-- RUNNING -> SCHEDING -->
  <path d="M 450 380 L 610 380" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M 610 380 L 600 374 L 600 386 Z" fill="#334155"/>
  <text x="530" y="370" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1e293b">sched()</text>

  <!-- SCHEDING -> READY -->
  <path d="M 660 430 L 660 480 L 110 480 L 110 440" stroke="#334155" stroke-width="2" stroke-dasharray="8,4" fill="none"/>
  <path d="M 110 440 L 105 452 L 115 452 Z" fill="#334155"/>
  <text x="385" y="470" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">reschedule</text>

  <!-- RUNNING -> MORIBUND -->
  <path d="M 390 440 L 390 530" stroke="#b91c1c" stroke-width="3" fill="none"/>
  <path d="M 390 530 L 384 520 L 396 520 Z" fill="#b91c1c"/>
  <text x="400" y="490" text-anchor="start" font-family="monospace" font-size="12" font-weight="bold" fill="#b91c1c">exit()</text>

  <!-- MORIBUND -> DEAD -->
  <path d="M 340 580 L 100 580 L 100 210" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M 100 210 L 94 222 L 106 222 Z" fill="#334155"/>
  <text x="200" y="570" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1e293b">reap()</text>

  <!-- State Nodes -->
  
  <!-- DEAD -->
  <g transform="translate(50, 100)">
    <circle cx="50" cy="50" r="50" fill="url(#grad-dead)" stroke="#1f2937" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#f8fafc">DEAD</text>
    <text x="50" y="65" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#cbd5e1">Terminated</text>
  </g>

  <!-- NEW -->
  <g transform="translate(650, 100)">
    <circle cx="50" cy="50" r="50" fill="url(#grad-new)" stroke="#92400e" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">NEW</text>
    <text x="50" y="65" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#ffffff">Allocated</text>
  </g>

  <!-- READY -->
  <g transform="translate(60, 330)">
    <circle cx="50" cy="50" r="50" fill="url(#grad-ready)" stroke="#1e40af" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">READY</text>
    <text x="50" y="65" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#ffffff">Runnable</text>
  </g>

  <!-- RUNNING -->
  <g transform="translate(340, 330)">
    <circle cx="50" cy="50" r="55" fill="url(#grad-running)" stroke="#065f46" stroke-width="4"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">RUNNING</text>
    <text x="50" y="65" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff">Active CPU</text>
  </g>

  <!-- SCHEDING -->
  <g transform="translate(620, 330)">
    <circle cx="50" cy="50" r="50" fill="url(#grad-scheding)" stroke="#991b1b" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">SCHEDING</text>
    <text x="50" y="65" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#ffffff">Transition</text>
  </g>

  <!-- MORIBUND -->
  <g transform="translate(340, 530)">
    <circle cx="50" cy="50" r="50" fill="url(#grad-moribund)" stroke="#5b21b6" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">MORIBUND</text>
    <text x="50" y="65" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#ffffff">Cleanup</text>
  </g>

</svg>
