<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-pool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="grad-active" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="grad-free" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="bold" fill="#0f172a">Global Exchange Pool Management</text>
  <text x="400" y="65" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#64748b">Resource Distribution and Lifecycle</text>

  <!-- Pool Box -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="600" height="280" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="3"/>
    <rect x="0" y="0" width="600" height="40" rx="12" fill="url(#grad-pool)"/>
    <text x="300" y="25" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff">The 64-Page Exchange Pool (256KB)</text>

    <!-- Page Grid -->
    <g transform="translate(30, 70)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#grad-active)" stroke="#065f46" stroke-width="1"/>
      <rect x="35" y="0" width="30" height="30" rx="4" fill="url(#grad-active)" stroke="#065f46" stroke-width="1"/>
      <rect x="70" y="0" width="30" height="30" rx="4" fill="url(#grad-free)" stroke="#334155" stroke-width="1"/>
      <rect x="105" y="0" width="30" height="30" rx="4" fill="url(#grad-free)" stroke="#334155" stroke-width="1"/>
      <rect x="140" y="0" width="30" height="30" rx="4" fill="url(#grad-free)" stroke="#334155" stroke-width="1"/>
      <rect x="175" y="0" width="30" height="30" rx="4" fill="url(#grad-active)" stroke="#065f46" stroke-width="1"/>
      
      <text x="540" y="20" text-anchor="end" font-family="Helvetica" font-size="11" fill="#475569">O(1) Free List Allocation</text>
    </g>

    <!-- Allocation Flow -->
    <g transform="translate(30, 140)">
      <path d="M 0 50 L 540 50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
      
      <!-- Request -->
      <g transform="translate(50, 20)">
        <rect x="0" y="0" width="120" height="60" rx="6" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2"/>
        <text x="60" y="25" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1e40af">Process A</text>
        <path d="M 60 60 L 60 90" stroke="#3b82f6" stroke-width="2" fill="none"/>
        <path d="M 60 90 L 56 82 L 64 82 Z" fill="#3b82f6"/>
        <text x="70" y="110" font-family="Helvetica" font-size="10" fill="#1e40af">p9_alloc_page()</text>
      </g>

      <!-- Distribution -->
      <g transform="translate(250, 20)">
        <rect x="0" y="0" width="120" height="60" rx="6" fill="#f1f5f9" stroke="#ef4444" stroke-width="2"/>
        <text x="60" y="25" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#991b1b">Process B</text>
        <path d="M 60 60 L 60 90" stroke="#ef4444" stroke-width="2" fill="none"/>
        <path d="M 60 90 L 56 82 L 64 82 Z" fill="#ef4444"/>
        <text x="70" y="110" font-family="Helvetica" font-size="10" fill="#991b1b">p9_alloc_page()</text>
      </g>
      
      <text x="300" y="160" text-anchor="middle" font-family="Helvetica" font-size="12" font-style="italic" fill="#334155">Isolation: Each process is bound to its specific pages. No leakage.</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(600, 150)">
    <rect x="0" y="0" width="15" height="15" fill="url(#grad-active)"/>
    <text x="25" y="12" font-family="Helvetica" font-size="11" fill="#334155">Allocated</text>
    <rect x="0" y="25" width="15" height="15" fill="url(#grad-free)"/>
    <text x="25" y="37" font-family="Helvetica" font-size="11" fill="#334155">Free</text>
  </g>
</svg>
