<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient Palette -->
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-kernel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="grad-page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="grad-pool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Zero-Copy 9P IPC Architecture</text>
  <text x="400" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">The Exchange Page Bridge</text>

  <!-- Main Bridge Line -->
  <path d="M 100 300 L 700 300" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,8"/>
  <text x="400" y="285" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="bold" fill="#64748b">Unified Physical Memory</text>

  <!-- USER PROCESS (Left Side) -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="240" height="300" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="3"/>
    <path d="M 0 40 L 240 40" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1e40af">User Process (Ring 3)</text>
    
    <!-- Buffer in User AS -->
    <rect x="20" y="100" width="200" height="120" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="120" y="125" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="bold" fill="#1d4ed8">IPC Window</text>
    <text x="120" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">p9uaddr (Virtual)</text>

    <!-- Step 1 & 5 -->
    <rect x="30" y="160" width="180" height="40" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="120" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a8a">TMessage / RMessage</text>
  </g>

  <!-- KERNEL SERVER (Right Side) -->
  <g transform="translate(510, 150)">
    <rect x="0" y="0" width="240" height="300" rx="12" fill="#fffafb" stroke="#ef4444" stroke-width="3"/>
    <path d="M 0 40 L 240 40" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#991b1b">Lux9 Kernel (Ring 0)</text>

    <!-- Buffer in Kernel AS -->
    <rect x="20" y="100" width="200" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="120" y="125" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="bold" fill="#991b1b">KADDR View</text>
    <text x="120" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#991b1b">KADDR(pa) (Virtual)</text>

    <!-- Processing -->
    <rect x="30" y="240" width="180" height="40" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
    <text x="120" y="265" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#7f1d1d">9P Dispatcher</text>
  </g>

  <!-- THE SHARED PHYSICAL FRAME (Center) -->
  <g transform="translate(320, 240)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="url(#grad-page)" stroke="#065f46" stroke-width="4"/>
    <text x="80" y="55" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff">Physical</text>
    <text x="80" y="80" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff">Frame</text>
    <text x="80" y="105" text-anchor="middle" font-family="monospace" font-size="12" fill="#d1fae5">4KB RAM</text>
  </g>

  <!-- Connector Ribbons (The "Bridge") -->
  
  <!-- Left Side Bridge -->
  <path d="M 290 270 C 310 270 310 270 320 270" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M 290 330 C 310 330 310 330 320 330" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M 290 270 L 290 330" stroke="#10b981" stroke-width="4"/>
  
  <!-- Right Side Bridge -->
  <path d="M 480 270 C 490 270 490 270 510 270" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M 480 330 C 490 330 490 330 510 330" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M 510 270 L 510 330" stroke="#10b981" stroke-width="4"/>

  <!-- Sequence Arrows (Step by Step) -->
  
  <!-- Step 1: Request -->
  <path d="M 170 360 L 170 380 Q 170 400 200 400 L 400 400" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <path d="M 400 400 L 390 396 L 390 404 Z" fill="#3b82f6"/>
  <text x="250" y="395" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1d4ed8">1. Process Writes Tmessage</text>

  <!-- Step 2: Trap/Syscall (implied) -->
  
  <!-- Step 3: Kernel Reads -->
  <path d="M 430 380 Q 430 420 460 420 L 630 420 L 630 400" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 630 400 L 626 410 L 634 410 Z" fill="#ef4444"/>
  <text x="560" y="435" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#b91c1c">2. Kernel Processes Directly</text>

  <!-- Step 4: Response -->
  <path d="M 650 360 L 650 480 L 430 480" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <path d="M 430 480 L 440 476 L 440 484 Z" fill="#ef4444"/>
  <text x="540" y="475" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#b91c1c">3. Kernel Writes Rmessage</text>

  <!-- Step 5: Process Reads -->
  <path d="M 370 480 L 150 480 L 150 450" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <path d="M 150 450 L 146 460 L 154 460 Z" fill="#3b82f6"/>
  <text x="230" y="495" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1d4ed8">4. Process Reads Response</text>

  <!-- Bottom Details Box -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="700" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="20" y="25" font-family="Helvetica" font-size="12" font-weight="bold" fill="#334155">Zero-Copy Key Concepts:</text>
    <text x="20" y="45" font-family="Helvetica" font-size="11" fill="#475569">Direct memory mapping avoids 'memcpy' between User and Kernel | Process isolation ensured via unique page-to-process bindings | O(1) Communication overhead.</text>
  </g>

</svg>
