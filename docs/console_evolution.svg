<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Console types -->
    <linearGradient id="uart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="serial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="framebuffer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="console" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#374151"/>
    </marker>
    <marker id="processArrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto">
      <path d="M0,0 L0,10 L12,5 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Console Output Evolution During Boot
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    From Early UART to Full Framebuffer Console
  </text>

  <!-- Timeline -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="url(#uart)" stroke="#b91c1c" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">1. UART</text>
    
    <text x="100" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Earliest Output</text>
    <text x="100" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="white">115200 baud</text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Reliable before memory setup</text>
    <text x="100" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• No framebuffer needed</text>
    <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Polled I/O</text>
    <text x="100" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Slow but reliable</text>
    
    <!-- Code example -->
    <rect x="10" y="145" width="180" height="80" rx="4" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="100" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">uartputs("TEST: main()", 21)</text>
    <text x="100" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">uartprintf("\nLux9\n")</text>
    <text x="100" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">// Character by character</text>
    <text x="100" y="210" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">Polled output</text>
    
    <text x="100" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Used in:</text>
    <text x="100" y="255" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• mach0init()</text>
    <text x="100" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• i8250console()</text>
    <text x="100" y="285" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Early boot logging</text>
    <text x="100" y="300" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Error reporting</text>
    <text x="100" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Debug output</text>
    <text x="100" y="340" text-anchor="middle" font-family="Arial" font-size="8" fill="#fef3c7">Only available console</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(270, 250)">
    <path d="M 0 0 L 80 0" stroke="#374151" stroke-width="3" marker-end="url(#processArrow)"/>
    <text x="40" y="-10" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">i8250console()</text>
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280">UART setup</text>
  </g>

  <!-- Stage 2: Serial Console -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="url(#serial)" stroke="#d97706" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">2. Serial Console</text>
    
    <text x="100" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Buffered Output</text>
    <text x="100" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="white">115200 baud</text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• UART interrupts enabled</text>
    <text x="100" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Ring buffer support</text>
    <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Interrupt-driven I/O</text>
    <text x="100" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Higher throughput</text>
    
    <!-- Code example -->
    <rect x="10" y="145" width="180" height="60" rx="4" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="100" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">uartputs() // buffered</text>
    <text x="100" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">// Interrupt driven</text>
    <text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">Faster output</text>
    
    <text x="100" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Used in:</text>
    <text x="100" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• bootargsinit()</text>
    <text x="100" y="255" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• trapinit0()</text>
    <text x="100" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Memory detection</text>
    <text x="100" y="285" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• CPU identification</text>
    <text x="100" y="315" text-anchor="middle" font-family="Arial" font-size="8" fill="#fef3c7">Before framebuffer</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(600, 250)">
    <path d="M 0 0 L 80 0" stroke="#374151" stroke-width="3" marker-end="url(#processArrow)"/>
    <text x="40" y="-10" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">bootscreeninit()</text>
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280">Screen detection</text>
  </g>

  <!-- Stage 3: Framebuffer Console -->
  <g transform="translate(710, 120)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="url(#framebuffer)" stroke="#16a34a" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">3. Framebuffer</text>
    
    <text x="100" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="white">High-Speed Output</text>
    <text x="100" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Graphics mode</text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Direct framebuffer access</text>
    <text x="100" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• DMA acceleration</text>
    <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Pixel-perfect output</text>
    <text x="100" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Rich text formatting</text>
    
    <!-- Code example -->
    <rect x="10" y="145" width="180" height="60" rx="4" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="100" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">fbconsoleinit()</text>
    <text x="100" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">print() // accelerated</text>
    <text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">Graphics console</text>
    
    <text x="100" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Used in:</text>
    <text x="100" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• boot sequence display</text>
    <text x="100" y="255" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Status updates</text>
    <text x="100" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Progress indicators</text>
    <text x="100" y="285" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Error messages</text>
    <text x="100" y="315" text-anchor="middle" font-family="Arial" font-size="8" fill="#dcfce7">Visual feedback</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(430, 450)">
    <path d="M 0 0 L 0 -80" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="15" y="-40" text-anchor="start" font-family="monospace" font-size="10" fill="#374151">console_ready = 1</text>
    <text x="15" y="-25" text-anchor="start" font-family="Arial" font-size="9" fill="#6b7280">Full console active</text>
  </g>

  <!-- Stage 4: Full Console -->
  <g transform="translate(250, 450)">
    <rect x="0" y="0" width="200" height="40" rx="8" fill="url(#console)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">4. Full Console System</text>
  </g>

  <!-- Console ready evolution -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="80" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#0c4a6e">Console Ready Evolution</text>
    
    <text x="20" y="45" font-family="Arial" font-size="10" fill="#0c4a6e">• console_ready = 0: Only UART output</text>
    <text x="280" y="45" font-family="Arial" font-size="10" fill="#0c4a6e">• console_ready = 1: Framebuffer + print() available</text>
    <text x="20" y="60" font-family="Arial" font-size="10" fill="#0c4a6e">• boot_log() automatically switches between UART and print()</text>
    <text x="500" y="60" font-family="Arial" font-size="10" fill="#0c4a6e">• Seamless transition preserves all output</text>
  </g>

</svg>
