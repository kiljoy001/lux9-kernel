<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" font-family="monospace" font-size="14">
  <rect x="10" y="10" width="760" height="340" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  <text x="390" y="35" text-anchor="middle" font-weight="bold">Kernel / User Address Space Overview</text>

  <rect x="40" y="60" width="700" height="50" fill="#ffe5e5" stroke="#c33"/>
  <text x="50" y="85">0x0000_0000_0000_0000 → 0x0000_7FFF_FFFF_FFFF : User space</text>
  <text x="60" y="105">UTZERO (text) … USTKTOP (stack/TOS)</text>

  <rect x="40" y="130" width="700" height="40" fill="#fff3cd" stroke="#c79500"/>
  <text x="50" y="155">KZERO identity map (early boot alias of low phys)</text>

  <rect x="40" y="180" width="700" height="50" fill="#d4f1ff" stroke="#1d70a2"/>
  <text x="50" y="205">KTZERO+ : Kernel ELF text/data, Mach blocks, kernel heap</text>
  <text x="50" y="225">Per-CPU Mach/TSS/GDT, Proc stacks+structs</text>

  <rect x="40" y="245" width="700" height="40" fill="#e8ffe3" stroke="#3c8a3c"/>
  <text x="50" y="270">HHDM (saved_limine_hhdm_offset): phys memory mirror</text>

  <rect x="40" y="295" width="700" height="40" fill="#f0e3ff" stroke="#6c3ca5"/>
  <text x="50" y="320">KMAP (2 MiB) &amp; VMAP (1 TiB) device windows at 0xfffffe..</text>
</svg>
