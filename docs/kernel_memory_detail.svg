<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" font-family="monospace" font-size="13">
  <rect x="10" y="10" width="800" height="500" fill="#fdfdfd" stroke="#333" stroke-width="2"/>
  <text x="410" y="35" text-anchor="middle" font-weight="bold">Detailed Kernel Regions</text>

  <!-- User space -->
  <rect x="40" y="60" width="740" height="60" fill="#ffe5e5" stroke="#c33"/>
  <text x="50" y="85">User space</text>
  <text x="60" y="105">UTZERO 0x0000_0000_0020_0000 → text/heap; USTKTOP 0x0000_7FFF_FFFF_F000 stack (16 MiB) + TOS</text>

  <!-- Kernel alias -->
  <rect x="40" y="135" width="740" height="40" fill="#fff3cd" stroke="#c79500"/>
  <text x="50" y="160">KZERO identity map (0xffff_ffff_8000_0000) used during bootstrap</text>

  <!-- Kernel text/data region -->
  <rect x="40" y="190" width="740" height="90" fill="#d4f1ff" stroke="#1d70a2"/>
  <text x="50" y="215">KTZERO ≈ KZERO+2 MiB → ELF text/data/BSS</text>
  <text x="50" y="235">Static tables: CPU0PML4/PDP/PD, GDT, Mach[0]</text>
  <text x="50" y="255">Per-CPU blocks: Mach struct + per-CPU stack + TSS per MACHSIZE (~256 KiB each)</text>

  <!-- Kernel heap/proc arena -->
  <rect x="40" y="295" width="740" height="70" fill="#e6f7ff" stroke="#2482b5" stroke-dasharray="6 4"/>
  <text x="50" y="320">Kernel heap / xalloc arena (addresses near ffff8000xxxx)</text>
  <text x="50" y="340">Each Proc: [kstack 128 KiB][Proc]; general kmalloc, Qlocks, device structs</text>

  <!-- HHDM -->
  <rect x="40" y="380" width="740" height="50" fill="#e8ffe3" stroke="#3c8a3c"/>
  <text x="50" y="405">HHDM 0xffff_8000_0000_0000 → phys mirror (initrd, page structs, phys IO)</text>

  <!-- Device windows -->
  <rect x="40" y="445" width="740" height="45" fill="#f0e3ff" stroke="#6c3ca5"/>
  <text x="50" y="470">KMAP 0xffff_fe00_0000_0000 (2 MiB) temp kmap + VMAP 0xffff_fe80_0000_0000 (1 TiB) IO mappings</text>
</svg>
