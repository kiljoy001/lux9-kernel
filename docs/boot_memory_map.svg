<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Memory type gradients -->
    <linearGradient id="memRAM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="memUMB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <linearGradient id="memUPA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="memACPI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="memReserved" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db"/>
      <stop offset="100%" style="stop-color:#6b7280"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Memory Map During Boot
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Physical Memory Discovery and Categorization
  </text>

  <!-- Memory Regions -->
  <!-- 0-640KB: Conventional RAM (UMB) -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="300" height="80" rx="4" fill="url(#memUMB)" stroke="#ca8a04" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#78350f">MemUMB</text>
    <text x="150" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#78350f">Upper Memory Block</text>
    <text x="150" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#78350f">0x000000 - 0x0A0000 (640KB)</text>
    <text x="150" y="80" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">ISA devices, BIOS</text>
  </g>

  <!-- 640KB-16MB: Reserved -->
  <g transform="translate(400, 120)">
    <rect x="0" y="0" width="150" height="80" rx="4" fill="url(#memReserved)" stroke="#4b5563" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Reserved</text>
    <text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">0x0A0000 - 0x1000000</text>
    <text x="75" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#4b5563">Video memory</text>
  </g>

  <!-- 16MB-4GB: Unbacked Physical Address (UPA) -->
  <g transform="translate(600, 120)">
    <rect x="0" y="0" width="300" height="80" rx="4" fill="url(#memUPA)" stroke="#4338ca" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e3a8a">MemUPA</text>
    <text x="150" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e3a8a">Unbacked Physical Address</text>
    <text x="150" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#3730a3">0x1000000 - 0x100000000 (16MB-4GB)</text>
    <text x="150" y="80" text-anchor="middle" font-family="Arial" font-size="9" fill="#3730a3">MMIO mapping space</text>
  </g>

  <!-- 4GB+: RAM -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="850" height="80" rx="4" fill="url(#memRAM)" stroke="#16a34a" stroke-width="2"/>
    <text x="425" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#15803d">MemRAM</text>
    <text x="425" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#15803d">Usable Physical RAM</text>
    <text x="425" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">0x100000000+ (4GB+)</text>
    <text x="425" y="80" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">Available for allocation</text>
  </g>

  <!-- Kernel Image -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="400" height="60" rx="4" fill="url(#kernel)" stroke="#d97706" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#92400e">Kernel Image</text>
    <text x="200" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#92400e">Text + Data + BSS</text>
  </g>

  <!-- ACPI Tables -->
  <g transform="translate(500, 380)">
    <rect x="0" y="0" width="200" height="60" rx="4" fill="url(#memACPI)" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#991b1b">MemACPI</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#991b1b">ACPI Tables</text>
  </g>

  <!-- Bootloader Reclaimable -->
  <g transform="translate(750, 380)">
    <rect x="0" y="0" width="150" height="60" rx="4" fill="url(#memReserved)" stroke="#4b5563" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Reclaimable</text>
    <text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Bootloader Data</text>
  </g>

  <!-- Discovery Process -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="850" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="425" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e40af">Memory Discovery Process</text>
    
    <!-- Process steps -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="160" height="55" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="80" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">1. liminescan()</text>
      <text x="80" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e40af">Parse Limine protocol</text>
      <text x="80" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#1d4ed8">Direct map entries</text>
    </g>
    
    <!-- Marker-less Arrow 1 -->
    <path d="M 185 77 L 205 77" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <path d="M 205 77 L 198 73 L 198 81 Z" fill="#3b82f6"/>
    
    <g transform="translate(210, 50)">
      <rect x="0" y="0" width="160" height="55" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="80" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">2. e820scan()</text>
      <text x="80" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e40af">Fallback: ACPI Tables</text>
      <text x="80" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#1d4ed8">BIOS Memory Map</text>
    </g>
    
    <!-- Marker-less Arrow 2 -->
    <path d="M 375 77 L 395 77" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <path d="M 395 77 L 388 73 L 388 81 Z" fill="#3b82f6"/>
    
    <g transform="translate(400, 50)">
      <rect x="0" y="0" width="160" height="55" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="80" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">3. ramscan()</text>
      <text x="80" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e40af">Last Resort: Probing</text>
      <text x="80" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#1d4ed8">4MB Segments</text>
    </g>
    
    <!-- Marker-less Arrow 3 -->
    <path d="M 565 77 L 585 77" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <path d="M 585 77 L 578 73 L 578 81 Z" fill="#3b82f6"/>
    
    <g transform="translate(590, 50)">
      <rect x="0" y="0" width="220" height="55" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="110" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#15803d">4. Build Unified Map</text>
      <text x="110" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#15803d">Internal categorized map</text>
      <text x="110" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#166534">Available for memmap(9)</text>
    </g>
  </g>

  <!-- Memory Type Details (Shifted Down) -->
  <g transform="translate(50, 630)">
    <rect x="0" y="0" width="400" height="80" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">Key Properties</text>
    <text x="20" y="40" font-family="Arial" font-size="10" fill="#6b7280">• MemRAM: Allocatable pages for processes</text>
    <text x="20" y="55" font-family="Arial" font-size="10" fill="#6b7280">• MemUMB: ISA devices, BIOS ROM space</text>
    <text x="20" y="70" font-family="Arial" font-size="10" fill="#6b7280">• MemUPA: Unbacked MMIO register window</text>
  </g>

  <!-- Caching Information (Shifted Down) -->
  <g transform="translate(500, 630)">
    <rect x="0" y="0" width="400" height="80" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#991b1b">Cache Configuration</text>
    <text x="20" y="40" font-family="Arial" font-size="10" fill="#7f1d1d">• MemUMB / MemUPA: Forced UC (Uncacheable)</text>
    <text x="20" y="55" font-family="Arial" font-size="10" fill="#7f1d1d">• MemRAM: Write-Back caching enabled</text>
    <text x="20" y="70" font-family="Arial" font-size="10" fill="#7f1d1d">• MTRR exclusion zones set during bootstrap</text>
  </g>

</svg>
