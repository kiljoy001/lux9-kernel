<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Structure colors -->
    <linearGradient id="user_cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="ledger_entry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="physical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#374151"/>
    </marker>
    <marker id="processArrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto">
      <path d="M0,0 L0,10 L12,5 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Capability Structure
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    UserCapability to BlindLedgerEntry Mapping
  </text>

  <!-- UserCapability Structure -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="300" height="400" rx="8" fill="url(#user_cap)" stroke="#047857" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">UserCapability</text>
    <text x="150" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#d1fae5">(User Space View)</text>
    
    <!-- Fields -->
    <rect x="10" y="70" width="280" height="40" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1"/>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#065f46">uuid_t uuid;              // 16 bytes</text>
    <text x="20" y="105" font-family="Arial" font-size="9" fill="#047857">Public identifier for wire protocol</text>
    
    <rect x="10" y="120" width="280" height="40" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1"/>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#065f46">u8int hash[32];        // 32 bytes</text>
    <text x="20" y="155" font-family="Arial" font-size="9" fill="#047857">BLAKE2b-256 hash</text>
    
    <rect x="10" y="170" width="280" height="30" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1"/>
    <text x="20" y="190" font-family="monospace" font-size="10" fill="#065f46">u64int size;              // 8 bytes</text>
    
    <rect x="10" y="210" width="280" height="30" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1"/>
    <text x="20" y="230" font-family="monospace" font-size="10" fill="#065f46">u32int type;              // 4 bytes</text>
    
    <rect x="10" y="250" width="280" height="30" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1"/>
    <text x="20" y="270" font-family="monospace" font-size="10" fill="#065f46">u32int perms;            // 4 bytes</text>
    
    <!-- Size indicator -->
    <rect x="10" y="300" width="280" height="40" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
    <text x="150" y="325" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#065f46">Total: 64 bytes</text>
    
    <!-- Security note -->
    <rect x="10" y="350" width="280" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="150" y="370" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#92400e">Opaque to users</text>
  </g>

  <!-- Hash Function -->
  <g transform="translate(400, 300)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#374151" stroke="#111827" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">Hash Function</text>
    
    <rect x="10" y="35" width="180" height="20" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1"/>
    <text x="100" y="50" text-anchor="middle" font-family="monospace" font-size="9" fill="#111827">BLAKE2b(secret | pa | perms | epoch)</text>
    
    <text x="100" y="70" text-anchor="middle" font-family="Arial" font-size="10" fill="#d1d5db">Cryptographic validation</text>
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="10" fill="#d1d5db">Tamper-evident</text>
  </g>

  <!-- Arrow from UserCapability to Hash -->
  <path d="M 350 300 L 400 350" stroke="#374151" stroke-width="3" marker-end="url(#processArrow)"/>

  <!-- BlindLedgerEntry Structure -->
  <g transform="translate(650, 150)">
    <rect x="0" y="0" width="300" height="400" rx="8" fill="url(#ledger_entry)" stroke="#3730a3" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">BlindLedgerEntry</text>
    <text x="150" y="45" text-anchor="middle" font-family="Arial" font-size="11" fill="#e0e7ff">(Kernel Space View)</text>
    
    <!-- Fields -->
    <rect x="10" y="70" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#3730a3">UserCapability capability;  // Full copy</text>
    
    <rect x="10" y="110" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="130" font-family="monospace" font-size="10" fill="#3730a3">uintptr physical_address; // The real resource</text>
    
    <rect x="10" y="150" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="170" font-family="monospace" font-size="10" fill="#3730a3">Proc *owner;            // Current owner</text>
    
    <rect x="10" y="190" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="210" font-family="monospace" font-size="10" fill="#3730a3">u8int secret[32];       // Crypto secret</text>
    
    <rect x="10" y="230" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="250" font-family="monospace" font-size="10" fill="#3730a3">u64int epoch;           // Use-after-free prevention</text>
    
    <rect x="10" y="270" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="290" font-family="monospace" font-size="10" fill="#3730a3">BlindLedgerState state;  // Lifecycle state</text>
    
    <rect x="10" y="310" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="330" font-family="monospace" font-size="10" fill="#3730a3">BlindLedgerHash leaf_hash;  // Immutable properties</text>
    
    <rect x="10" y="350" width="280" height="30" rx="4" fill="#ffffff" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="370" font-family="monospace" font-size="10" fill="#3730a3">BlindLedgerHash process_hash; // Mutable properties</text>
    
    <!-- Size indicator -->
    <rect x="10" y="390" width="280" height="30" rx="4" fill="#eef2ff" stroke="#3730a3" stroke-width="1"/>
    <text x="150" y="410" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#3730a3">~128+ bytes</text>
  </g>

  <!-- Arrow from Hash to BlindLedgerEntry -->
  <path d="M 600 350 L 650 300" stroke="#374151" stroke-width="3" marker-end="url(#processArrow)"/>

  <!-- Physical Resource -->
  <g transform="translate(650, 580)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="url(#physical)" stroke="#d97706" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Physical Resource</text>
    <text x="150" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">Physical Memory Page</text>
    <text x="150" y="70" text-anchor="middle" font-family="Arial" font-size="11" fill="#fef3c7">The actual 4KB page</text>
  </g>

  <!-- Arrow from BlindLedgerEntry to Physical -->
  <path d="M 650 550 L 650 580" stroke="#374151" stroke-width="3" marker-end="url(#processArrow)"/>

  <!-- Security Properties Box -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="550" height="100" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="275" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#dc2626">Security Properties</text>
    
    <text x="20" y="50" font-family="Arial" font-size="11" fill="#7f1d1d">• Self-authenticating: Capabilities contain their own proof</text>
    <text x="20" y="65" font-family="Arial" font-size="11" fill="#7f1d1d">• Zero-knowledge: Users never see implementation details</text>
    <text x="20" y="80" font-family="Arial" font-size="11" fill="#7f1d1d">• Cryptographic: 256-bit BLAKE2b security</text>
    <text x="300" y="50" font-family="Arial" font-size="11" fill="#7f1d1d">• Epoch protection: Use-after-free prevention</text>
    <text x="300" y="65" font-family="Arial" font-size="11" fill="#7f1d1d">• Transferable: Resources shared through capabilities</text>
    <text x="300" y="80" font-family="Arial" font-size="11" fill="#7f1d1d">• Revocable: Kernel can invalidate capabilities</text>
  </g>

  <!-- Validation Flow Arrow -->
  <g transform="translate(400, 420)">
    <path d="M 0 0 L 0 80" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <text x="15" y="30" font-family="monospace" font-size="10" fill="#dc2626">Validate</text>
    <text x="15" y="45" font-family="monospace" font-size="10" fill="#dc2626">Hash Check</text>
    <text x="15" y="60" font-family="monospace" font-size="10" fill="#dc2626">Epoch Verify</text>
    <text x="15" y="75" font-family="monospace" font-size="10" fill="#dc2626">Permission Check</text>
  </g>

</svg>
