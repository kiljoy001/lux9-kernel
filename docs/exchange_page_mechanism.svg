<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-kernel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="grad-page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="bold" fill="#0f172a">Zero-Copy Bridge Mechanism</text>
  <text x="400" y="65" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#64748b">Shared Physical Page Mapping</text>

  <!-- User Space -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="220" height="300" rx="10" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="10" fill="url(#grad-user)"/>
    <text x="110" y="25" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff">User Space (Ring 3)</text>
    
    <rect x="20" y="120" width="180" height="100" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="110" y="145" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#065f46">Shared Window</text>
    <text x="110" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#065f46">p9uaddr</text>
    <text x="110" y="195" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#059669">Process Writes Here</text>
  </g>

  <!-- Physical Memory -->
  <g transform="translate(320, 200)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="url(#grad-page)" stroke="#064e3b" stroke-width="3"/>
    <text x="80" y="45" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff">Physical Page</text>
    <text x="80" y="70" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#d1fae5">4KB Frame</text>
  </g>

  <!-- Kernel Space -->
  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="220" height="300" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="10" fill="url(#grad-kernel)"/>
    <text x="110" y="25" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff">Kernel (Ring 0)</text>

    <rect x="20" y="120" width="180" height="100" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="110" y="145" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#065f46">HHDM Static View</text>
    <text x="110" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#065f46">KADDR(pa)</text>
    <text x="110" y="195" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#059669">Kernel Reads Here</text>
  </g>

  <!-- Arrows -->
  <path d="M 320 250 Q 250 250 230 240" stroke="#10b981" stroke-width="3" fill="none" stroke-dasharray="5,2"/>
  <path d="M 230 240 L 242 240 L 238 232 Z" fill="#10b981" transform="rotate(-15, 230, 240)"/>
  
  <path d="M 480 250 Q 550 250 570 240" stroke="#10b981" stroke-width="3" fill="none" stroke-dasharray="5,2"/>
  <path d="M 570 240 L 558 240 L 562 232 Z" fill="#10b981" transform="rotate(15, 570, 240)"/>

  <text x="400" y="450" text-anchor="middle" font-family="Helvetica" font-size="12" font-style="italic" fill="#334155">No data copying between address spaces. Both views access the SAME physical silicon.</text>
</svg>
