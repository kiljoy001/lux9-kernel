<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .proc { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 10; }
      .kernel { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 10; }
      .shared { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; stroke-dasharray: 5,5; }
      .struct { fill: #ffffff; stroke: #333; stroke-width: 1; font-family: monospace; font-size: 12px; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .text { font-family: sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
      .label { font-family: sans-serif; font-size: 12px; fill: #666; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="400" y="30" class="title" text-anchor="middle">9P Syscall Interface: Legacy vs Native</text>

  <!-- User Space -->
  <rect x="50" y="50" width="300" height="500" class="proc" />
  <text x="200" y="80" class="title">User Space</text>

  <!-- Legacy Path -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="100" height="50" fill="#fff" stroke="#333" />
    <text x="50" y="20" class="text">Legacy Binary</text>
    <text x="50" y="40" class="label">(INT 64)</text>
  </g>

  <!-- Native Path -->
  <g transform="translate(220, 120)">
    <rect x="0" y="0" width="100" height="50" fill="#fff" stroke="#333" />
    <text x="50" y="20" class="text">Native App</text>
    <text x="50" y="40" class="label">(Direct Write)</text>
  </g>

  <!-- Shared Memory -->
  <g transform="translate(250, 250)">
    <rect x="-30" y="0" width="160" height="150" class="shared" />
    <text x="50" y="20" class="text">Exchange Page</text>
    
    <!-- Tsys Struct Visualization -->
    <rect x="-10" y="40" width="120" height="100" class="struct" />
    <text x="50" y="60" class="text" font-size="10">Tsys Struct</text>
    <line x1="-10" y1="70" x2="110" y2="70" stroke="#333" />
    <text x="50" y="85" class="text" font-size="10">scallnr (4B)</text>
    <line x1="-10" y1="95" x2="110" y2="95" stroke="#333" />
    <text x="50" y="110" class="text" font-size="10">sflags (4B)</text>
    <line x1="-10" y1="120" x2="110" y2="120" stroke="#333" />
    <text x="50" y="135" class="text" font-size="10">Payload...</text>
  </g>

  <!-- Kernel Space -->
  <rect x="450" y="50" width="300" height="500" class="kernel" />
  <text x="600" y="80" class="title">Kernel Space</text>

  <!-- Trap Handler -->
  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="140" height="60" fill="#ffebee" stroke="#c62828" />
    <text x="70" y="25" class="text">Trap Handler</text>
    <text x="70" y="45" class="label">syscall_to_9p</text>
  </g>

  <!-- Translation -->
  <g transform="translate(480, 220)">
    <rect x="0" y="0" width="140" height="40" fill="#fff3e0" stroke="#ff9800" />
    <text x="70" y="25" class="text">Translation</text>
  </g>

  <!-- 9P Router -->
  <g transform="translate(550, 350)">
    <rect x="-50" y="0" width="200" height="80" fill="#f3e5f5" stroke="#7b1fa2" />
    <text x="50" y="30" class="title">9P Router</text>
    <text x="50" y="50" class="label">(p9_dispatch)</text>
  </g>

  <!-- Connections -->
  
  <!-- Legacy Flow -->
  <path d="M 130 170 L 130 195 L 480 150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="550" y1="180" x2="550" y2="220" class="arrow" />
  <line x1="550" y1="260" x2="600" y2="350" class="arrow" />

  <!-- Native Flow -->
  <line x1="270" y1="170" x2="300" y2="250" class="arrow" />
  <path d="M 330 400 L 500 400" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <text x="415" y="390" class="label">Zero-Copy Read</text>

</svg>