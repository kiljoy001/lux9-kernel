<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .exec { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 10; }
      .vault { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 10; }
      .link { stroke: #333; stroke-width: 3; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
      .text { font-family: sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
      .label { font-family: sans-serif; font-size: 12px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="400" y="30" class="title" text-anchor="middle">WASM Split-State Architecture</text>

  <!-- Execution Plane (WASM) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="300" height="350" class="exec" />
    <text x="150" y="30" class="title">Execution Plane</text>
    <text x="150" y="50" class="label">(WASM Linear Memory)</text>
    
    <!-- Components -->
    <rect x="50" y="80" width="200" height="40" fill="#bbdefb" stroke="#1976d2" />
    <text x="150" y="105" class="text">Stack (Transient)</text>

    <rect x="50" y="140" width="200" height="100" fill="#bbdefb" stroke="#1976d2" />
    <text x="150" y="195" class="text">WASM Heap</text>
    
    <text x="150" y="300" class="text" font-weight="bold" fill="#c62828">HARD CAP: 64MB</text>
    <text x="150" y="320" class="label">Kernel Safety Limit</text>
  </g>

  <!-- Storage Plane (Process Vault) -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="300" height="350" class="vault" />
    <text x="150" y="30" class="title">Storage Plane</text>
    <text x="150" y="50" class="label">(Process Vault)</text>

    <!-- Components -->
    <rect x="50" y="80" width="200" height="200" fill="#ffe0b2" stroke="#f57c00" />
    <text x="150" y="150" class="text">Encrypted Data</text>
    <text x="150" y="170" class="text">Large Datasets</text>
    <text x="150" y="190" class="text">Persistent State</text>
    
    <text x="150" y="300" class="text" font-weight="bold" fill="#2e7d32">SIZE: UNLIMITED</text>
    <text x="150" y="320" class="label">(Virtual Memory Backed)</text>
  </g>

  <!-- Interaction -->
  <line x1="350" y1="200" x2="450" y2="200" class="link" />
  <rect x="360" y="180" width="80" height="40" fill="#fff" stroke="#333" rx: 5; />
  <text x="400" y="205" class="label">9P /dev/vault</text>

</svg>