<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <linearGradient id="user" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6fffa"/>
      <stop offset="100%" style="stop-color:#b2f5ea"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ebf8ff"/>
      <stop offset="100%" style="stop-color:#bee3f8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#ffe0b2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-flip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ed8936"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2d3748">IPC Ring Buffer: Page Flipping Architecture</text>

  <!-- Regions -->
  <!-- User Space -->
  <rect x="50" y="70" width="300" height="780" rx="4" fill="url(#user)" stroke="#38b2ac" stroke-width="2" fill-opacity="0.3"/>
  <text x="200" y="95" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#234e52">User Space (Client)</text>
  
  <!-- Kernel Space -->
  <rect x="650" y="70" width="300" height="780" rx="4" fill="url(#kernel)" stroke="#3182ce" stroke-width="2" fill-opacity="0.3"/>
  <text x="800" y="95" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2b6cb0">Kernel Space (Router)</text>

  <!-- Shared Memory / Transition Zone -->
  <line x1="500" y1="70" x2="500" y2="850" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Structures -->
  
  <!-- 1. Control Page -->
  <g transform="translate(350, 140)">
     <rect x="0" y="0" width="300" height="140" rx="8" fill="url(#ring)" stroke="#ed8936" stroke-width="2" filter="url(#shadow)"/>
     <text x="150" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#c05621">Control Page (Shared)</text>
     
     <!-- Submission Ring -->
     <g transform="translate(20, 40)">
       <rect x="0" y="0" width="120" height="80" rx="4" fill="white" stroke="#a0aec0"/>
       <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="bold">Submission Ring</text>
       <line x1="10" y1="30" x2="110" y2="30" stroke="#cbd5e0"/>
       <text x="60" y="45" text-anchor="middle" font-family="monospace" font-size="10">head: 42</text>
       <text x="60" y="60" text-anchor="middle" font-family="monospace" font-size="10">tail: 43</text>
       <text x="60" y="75" text-anchor="middle" font-size="10" fill="#2c7a7b">User Writes →</text>
     </g>
     
     <!-- Completion Ring -->
     <g transform="translate(160, 40)">
       <rect x="0" y="0" width="120" height="80" rx="4" fill="white" stroke="#a0aec0"/>
       <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="bold">Completion Ring</text>
       <line x1="10" y1="30" x2="110" y2="30" stroke="#cbd5e0"/>
       <text x="60" y="45" text-anchor="middle" font-family="monospace" font-size="10">head: 10</text>
       <text x="60" y="60" text-anchor="middle" font-family="monospace" font-size="10">tail: 10</text>
       <text x="60" y="75" text-anchor="middle" font-size="10" fill="#2b6cb0">← Kern Writes</text>
     </g>
  </g>

  <!-- 2. The Flow -->
  
  <!-- Step 1: User Prepares Batch -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="140" height="60" rx="4" fill="white" stroke="#38b2ac" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12">1. Prepare Batch</text>
    <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10">Fill BatchHeader</text>
  </g>
  
  <path d="M 240 350 L 350 350" stroke="#38b2ac" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Batch Page (User Owned) -->
  <g transform="translate(360, 310)">
    <rect x="0" y="0" width="120" height="80" rx="4" fill="#e6fffa" stroke="#38b2ac" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#234e52">Batch Page</text>
    <text x="60" y="45" text-anchor="middle" font-size="10">State: Owned</text>
    <text x="60" y="60" text-anchor="middle" font-size="10">Mapped: RW</text>
  </g>

  <!-- Step 2: Submit to Ring -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="140" height="60" rx="4" fill="white" stroke="#38b2ac" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12">2. Submit</text>
    <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10">ring.tail++</text>
  </g>
  
  <path d="M 240 450 L 320 450 L 320 220 L 350 220" stroke="#ed8936" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- Step 3: Kernel Pickup (Flip) -->
  <g transform="translate(750, 350)">
    <rect x="0" y="0" width="140" height="60" rx="4" fill="white" stroke="#3182ce" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12">3. Acquire (Flip)</text>
    <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10">Unmap User VA</text>
  </g>
  
  <!-- Transition Arrow -->
  <path d="M 520 280 L 520 400 L 750 400" stroke="#ed8936" stroke-width="3" marker-end="url(#arrow-flip)" fill="none"/>
  <text x="540" y="380" font-weight="bold" font-size="12" fill="#c05621">Ownership Transfer</text>

  <!-- Batch Page (Kernel Owned) -->
  <g transform="translate(580, 450)">
    <rect x="0" y="0" width="120" height="80" rx="4" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6cb0">Batch Page</text>
    <text x="60" y="45" text-anchor="middle" font-size="10">State: Kernel</text>
    <text x="60" y="60" text-anchor="middle" font-size="10">User: No Access</text>
  </g>

  <!-- Step 4: Processing -->
  <g transform="translate(750, 550)">
    <rect x="0" y="0" width="140" height="100" rx="4" fill="white" stroke="#3182ce" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12">4. Process Batch</text>
    <line x1="10" y1="35" x2="130" y2="35" stroke="#cbd5e0"/>
    <text x="70" y="55" text-anchor="middle" font-size="10">- Validate Header</text>
    <text x="70" y="70" text-anchor="middle" font-size="10">- Loop Messages</text>
    <text x="70" y="85" text-anchor="middle" font-size="10">- Dispatch (9P)</text>
  </g>
  
  <path d="M 700 490 L 750 550" stroke="#3182ce" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Return -->
  <g transform="translate(750, 700)">
    <rect x="0" y="0" width="140" height="60" rx="4" fill="white" stroke="#3182ce" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12">5. Complete</text>
    <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10">comp.tail++</text>
  </g>
  
  <path d="M 750 730 L 550 730 L 550 220 L 510 220" stroke="#ed8936" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- Step 6: User Recycle -->
  <g transform="translate(100, 700)">
    <rect x="0" y="0" width="140" height="60" rx="4" fill="white" stroke="#38b2ac" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12">6. Recycle Page</text>
    <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10">Re-map RW</text>
  </g>

</svg>
