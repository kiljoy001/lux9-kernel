<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <linearGradient id="userSpace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6fffa"/> <!-- Teal 50 -->
      <stop offset="100%" style="stop-color:#b2f5ea"/> <!-- Teal 100 -->
    </linearGradient>
    <linearGradient id="kernelSpace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ebf8ff"/> <!-- Blue 50 -->
      <stop offset="100%" style="stop-color:#bee3f8"/> <!-- Blue 100 -->
    </linearGradient>
    <linearGradient id="hwSpace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fafc"/> <!-- Gray 50 -->
      <stop offset="100%" style="stop-color:#edf2f7"/> <!-- Gray 100 -->
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2d3748">Lux9 System Architecture</text>

  <!-- Layers -->
  <!-- Userspace -->
  <rect x="50" y="80" width="900" height="200" rx="10" fill="url(#userSpace)" stroke="#38b2ac" stroke-width="2"/>
  <text x="70" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c7a7b">USERSPACE (Ring 3)</text>
  
  <!-- Kernel -->
  <rect x="50" y="320" width="900" height="300" rx="10" fill="url(#kernelSpace)" stroke="#3182ce" stroke-width="2"/>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2b6cb0">SAFE MICROKERNEL (Ring 0)</text>

  <!-- Hardware -->
  <rect x="50" y="660" width="900" height="100" rx="10" fill="url(#hwSpace)" stroke="#a0aec0" stroke-width="2"/>
  <text x="70" y="690" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a5568">HARDWARE LAYER</text>

  <!-- Userspace Components -->
  <!-- CLR App -->
  <g transform="translate(150, 130)">
    <rect width="180" height="120" rx="6" fill="white" stroke="#38b2ac" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2d3748">CLR Runtime</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#718096">/boot/boot</text>
    <line x1="10" y1="70" x2="170" y2="70" stroke="#cbd5e0"/>
    <text x="90" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Managed Code (C#, F#)</text>
    <text x="90" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Type Safety</text>
  </g>

  <!-- 9P Servers -->
  <g transform="translate(400, 130)">
    <rect width="180" height="120" rx="6" fill="white" stroke="#805ad5" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2d3748">User Process</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#718096">/bin/sh</text>
    <line x1="10" y1="70" x2="170" y2="70" stroke="#cbd5e0"/>
    <text x="90" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Shell</text>
  </g>

  <g transform="translate(650, 130)">
    <rect width="180" height="120" rx="6" fill="white" stroke="#e53e3e" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2d3748">9P Servers</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#718096">dev(disk, net)</text>
    <line x1="10" y1="70" x2="170" y2="70" stroke="#cbd5e0"/>
    <text x="90" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Drivers in Userspace</text>
  </g>

  <!-- Exchange Channel -->
  <rect x="150" y="295" width="680" height="10" rx="2" fill="#ed8936"/>
  <text x="490" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ed8936">9P Message Channel (Exchange Pages)</text>

  <!-- Kernel Components -->
  <!-- 9P Router -->
  <g transform="translate(350, 360)">
    <rect width="280" height="60" rx="6" fill="white" stroke="#dd6b20" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#c05621">9P Router &amp; Lock DAG</text>
  </g>

  <!-- Pebble Core -->
  <g transform="translate(80, 450)">
    <rect width="250" height="140" rx="6" fill="white" stroke="#3182ce" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2d3748">Pebble &amp; Borrow Checker</text>
    <line x1="10" y1="45" x2="240" y2="45" stroke="#cbd5e0"/>
    <text x="125" y="70" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Memory Tokens</text>
    <text x="125" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Ownership Rules</text>
    <text x="125" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Capability Verification</text>
  </g>

  <!-- 9front Core -->
  <g transform="translate(360, 450)">
    <rect width="260" height="140" rx="6" fill="white" stroke="#4a5568" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2d3748">9front Core</text>
    <line x1="10" y1="45" x2="250" y2="45" stroke="#cbd5e0"/>
    <text x="130" y="70" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Process Scheduler</text>
    <text x="130" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Virtual Memory (MMU)</text>
    <text x="130" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Syscall Dispatch</text>
  </g>

  <!-- Family HAL -->
  <g transform="translate(650, 450)">
    <rect width="220" height="140" rx="6" fill="white" stroke="#805ad5" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2d3748">Family HAL</text>
    <line x1="10" y1="45" x2="210" y2="45" stroke="#cbd5e0"/>
    <text x="110" y="70" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Device Families</text>
    <text x="110" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">PCI Enumeration</text>
    <text x="110" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a5568">Resource Allocation</text>
  </g>

  <!-- Hardware Components -->
  <g transform="translate(80, 710)">
    <rect width="820" height="40" rx="4" fill="white" stroke="#a0aec0"/>
    <text x="410" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#4a5568">
      x86-64 Hardware (CPU, RAM, PCI Bus, I/O Ports, APIC)
    </text>
  </g>

  <!-- Arrows -->
  <path d="M 240 250 L 240 310" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <path d="M 490 250 L 490 310" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <path d="M 740 250 L 740 310" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  
  <path d="M 490 330 L 490 355" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <path d="M 490 420 L 490 445" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 390 420 L 250 445" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 590 420 L 730 445" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 490 590 L 490 655" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
