<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- State colors -->
    <linearGradient id="free" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb"/>
      <stop offset="100%" style="stop-color:#9ca3af"/>
    </linearGradient>
    <linearGradient id="exclusive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="shared" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="mut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="processArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Borrow Checker State Machine
  </text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Rust-Style Ownership and Borrowing States
  </text>

  <!-- State Nodes -->
  
  <!-- BORROW_FREE - Center -->
  <g transform="translate(350, 200)">
    <circle cx="50" cy="50" r="50" fill="url(#free)" stroke="#6b7280" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#374151">FREE</text>
    <text x="50" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Unowned</text>
  </g>

  <!-- BORROW_EXCLUSIVE - Right -->
  <g transform="translate(550, 150)">
    <circle cx="50" cy="50" r="50" fill="url(#exclusive)" stroke="#b91c1c" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">EXCLUSIVE</text>
    <text x="50" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="white">One owner</text>
  </g>

  <!-- BORROW_SHARED_OWNED - Left -->
  <g transform="translate(150, 150)">
    <circle cx="50" cy="50" r="50" fill="url(#shared)" stroke="#1d4ed8" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">SHARED</text>
    <text x="50" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Multiple readers</text>
  </g>

  <!-- BORROW_MUT_LENT - Bottom -->
  <g transform="translate(350, 350)">
    <circle cx="50" cy="50" r="50" fill="url(#mut)" stroke="#d97706" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">MUT_LENT</text>
    <text x="50" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Exclusive borrow</text>
  </g>

  <!-- State Transitions -->
  
  <!-- FREE -> EXCLUSIVE (acquire) -->
  <path d="M 400 200 L 600 150" stroke="#374151" stroke-width="3" marker-end="url(#processArrow)"/>
  <text x="480" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">borrow_acquire()</text>
  <text x="480" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#6b7280">exclusive ownership</text>
  
  <!-- FREE -> SHARED (borrow_shared) -->
  <path d="M 300 200 L 200 150" stroke="#374151" stroke-width="3" marker-end="url(#processArrow)"/>
  <text x="250" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">borrow_borrow_shared()</text>
  <text x="250" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#6b7280">shared access</text>
  
  <!-- EXCLUSIVE -> SHARED (borrow_shared) -->
  <path d="M 500 150 L 200 150" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="350" y="135" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8">borrow_borrow_shared()</text>
  <text x="350" y="150" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d4ed8">convert to shared</text>
  
  <!-- SHARED -> MUT (borrow_mut) -->
  <path d="M 200 200 L 350 300" stroke="#f59e0b" stroke-width="3" marker-end="url(#processArrow)"/>
  <text x="250" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#d97706">borrow_borrow_mut()</text>
  <text x="250" y="255" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97706">exclusive access</text>
  
  <!-- EXCLUSIVE -> MUT (borrow_mut) -->
  <path d="M 550 200 L 400 300" stroke="#f59e0b" stroke-width="3" marker-end="url(#processArrow)"/>
  <text x="475" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#d97706">borrow_borrow_mut()</text>
  <text x="475" y="255" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97706">exclusive access</text>
  
  <!-- SHARED -> FREE (release_all) -->
  <path d="M 200 150 L 300 200" stroke="#374151" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="250" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#6b7280">release shared</text>
  
  <!-- EXCLUSIVE -> FREE (release) -->
  <path d="M 500 150 L 350 200" stroke="#374151" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="425" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#6b7280">release exclusive</text>
  
  <!-- MUT_LENT -> FREE (return_mut) -->
  <path d="M 400 300 L 400 250" stroke="#374151" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="420" y="280" text-anchor="start" font-family="monospace" font-size="9" fill="#6b7280">return_mut()</text>
  
  <!-- MUT_LENT -> EXCLUSIVE (return_mut to owner) -->
  <path d="M 350 350 L 500 200" stroke="#374151" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="400" y="290" text-anchor="middle" font-family="monospace" font-size="9" fill="#6b7280">return_mut()</text>

  <!-- Error Conditions Box -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="700" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="350" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#dc2626">Error Conditions</text>
    
    <!-- Error messages -->
    <text x="20" y="50" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_EALREADY: Resource already owned</text>
    <text x="20" y="65" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_ESHAREDBORROW: Cannot create mutable borrow - has shared borrows</text>
    <text x="20" y="80" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_EMUTBORROW: Cannot create mutable borrow - already &mut</text>
    <text x="20" y="95" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_ENOTOWNER: Caller is not the owner</text>
    <text x="350" y="50" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_EBORROWED: Cannot modify - has active borrows</text>
    <text x="350" y="65" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_ENOTBORROWED: Not borrowed - cannot return</text>
    <text x="350" y="80" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_EINVAL: Invalid parameters</text>
    <text x="350" y="95" font-family="Arial" font-size="11" fill="#7f1d1d">• BORROW_ENOTFOUND: Resource not found</text>
  </g>

</svg>
